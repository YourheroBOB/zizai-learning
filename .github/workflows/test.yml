name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run logic tests
        run: node tests/test_zizai.js
